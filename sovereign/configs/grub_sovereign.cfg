# ============================================================================
#  REMBO-Bliss-os Sovereign Edition — GRUB Boot Configuration
#  Lead Architect: FERAS-AL-ABBADI
# ============================================================================

set timeout=5
set default=0

menuentry 'REMBO-Bliss-os Sovereign Edition (NVK+GSP 180Hz)' --class android-x86 {
    savedefault
    search --no-floppy --set=root -f /system.efs
    linux /kernel root=/dev/ram0 androidboot.selinux=permissive \
        androidboot.hardware=android_x86_64 \
        nouveau.config=NvGspRm=1 \
        nouveau.debug=info,VBIOS=info,PWR=debug \
        VULKAN=1 HWACCEL=1 \
        HWC=drm_minigbm GRALLOC=minigbm \
        video=1920x1080@180 \
        androidboot.selinux=0 \
        usbhid.mousepoll=1 \
        net.ifnames=0 \
        quiet
    initrd /initrd.img
}

menuentry 'REMBO-Bliss-os (PC-Mode / Debug)' --class android-x86 {
    search --no-floppy --set=root -f /system.efs
    linux /kernel root=/dev/ram0 androidboot.selinux=permissive \
        androidboot.hardware=android_x86_64 \
        nouveau.config=NvGspRm=1 \
        VULKAN=1 HWACCEL=1 \
        HWC=drm_minigbm GRALLOC=minigbm \
        video=1920x1080@60 \
        androidboot.selinux=0 \
        DEBUG=2 \
        SRC=/bliss
    initrd /initrd.img
}

menuentry 'REMBO-Bliss-os (Safe Mode — Generic Display)' --class android-x86 {
    search --no-floppy --set=root -f /system.efs
    linux /kernel root=/dev/ram0 androidboot.selinux=permissive \
        androidboot.hardware=android_x86_64 \
        nomodeset \
        video=1024x768@60 \
        androidboot.selinux=0 \
        SRC=/bliss
    initrd /initrd.img
}
